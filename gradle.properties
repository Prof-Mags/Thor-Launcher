# THOR Launcher — Gradle build configuration.

# The Kotlin/KSP/Hilt toolchain is memory hungry across 15 modules, but it was
# hungrier than the machine. Two separate JVMs run a build: Gradle's own daemon
# and the Kotlin compile daemon, and only the first was bounded — the Kotlin one
# was observed at 5.2 GB beside a 1.9 GB Gradle daemon on a 16 GB machine.
#
# The failure that causes does not look like memory pressure. Compilation starts
# reporting "unresolved reference" for entire modules whose classes are present
# and on the classpath, lint reports internal errors, and the JVM leaves
# hs_err/replay dumps in the project root. Hours were lost to that here, chasing
# a dependency bug that did not exist.
#
# Both are bounded now, and to a total that leaves the rest of the machine
# usable. Raise them together if a build genuinely runs out — never just one.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Workers are capped because each Kotlin task can fork its own compiler; left
# unbounded on a machine with more cores than headroom, they multiply the memory
# above rather than the throughput.
org.gradle.workers.max=4

# Configuration cache keeps warm builds fast; the plugins used here all support it.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# AndroidX only — no support-library translation.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Dagger/Hilt: use the faster, aggregating KSP task graph.
ksp.incremental=true
