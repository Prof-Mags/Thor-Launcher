# THOR Launcher — Gradle build configuration.

# The Kotlin/KSP/Hilt toolchain is memory hungry across 13 modules.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Configuration cache keeps warm builds fast; the plugins used here all support it.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# AndroidX only — no support-library translation.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Dagger/Hilt: use the faster, aggregating KSP task graph.
ksp.incremental=true
