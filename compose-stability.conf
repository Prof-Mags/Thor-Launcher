// Types the Compose compiler should treat as stable.
//
// `:core:model` is a plain JVM module — deliberately, so the domain types stay
// free of Android imports and are instantly unit-testable. The cost of that is
// invisible and expensive: the Compose compiler is never applied there, so those
// classes carry no stability metadata, and every composable that takes one is
// inferred **unstable**. An unstable parameter means the composable can never
// skip, so a cursor press repainted the whole launcher rather than the two cells
// that changed.
//
// Every type this covers is a `data class` or `enum` of read-only fields, and the
// repositories rebuild snapshots rather than editing them in place. They are
// stable in fact; this only says so. Nothing here changes behaviour or
// appearance.
//
// Listing the package is enough on its own: an explicit entry marks the class
// stable regardless of its fields, so the `List` and `Map` properties inside no
// longer drag their owners unstable. Kotlin's collection interfaces are
// deliberately *not* listed here — doing that would assert something this file
// cannot guarantee about every list in the app, and the failure mode is a screen
// that quietly stops updating.
//
// See https://developer.android.com/develop/ui/compose/performance/stability/fix

com.thor.core.model.*
